[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiq-client"
version = "0.1.1"
description = "Unofficial ExtremeCloud IQ / Extreme Platform ONE API client: token auth, timeouts, retries, pagination."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kaikino" }]
keywords = ["extremecloudiq", "xiq", "platform-one"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/kaikino/xiq-client"
Source = "https://github.com/kaikino/xiq-client"
Issues = "https://github.com/kaikino/xiq-client/issues"
Changelog = "https://github.com/kaikino/xiq-client/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xiq_client = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
